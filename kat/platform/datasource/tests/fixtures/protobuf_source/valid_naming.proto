syntax = "proto3";

package fixture.protobuf_source.naming;

message HTTPURLPayload {
  string endpoint_url = 1;
}

message GPUCPUStats {
  uint64 gpu_cycles = 1;
  uint64 cpu_cycles = 2;
}

message HTTP2URLStats {
  uint64 request_count = 1;
}

// 覆盖 Rust keyword field 与 acronym-heavy message 的 prost binding。
message KeywordAcronymRoot {
  int32 type = 1;
  string match = 2;
  bool async = 3;
  string gen = 4;
  string self = 5;
  HTTPURLPayload http_url_payload = 6;
  repeated GPUCPUStats gpu_cpu_stats = 7;
  HTTP2URLStats http2_url_stats = 8;
  string field_0_name6 = 9;
  string field_name18 = 10;
}

message Payload {
  string top_level_value = 1;
}

// 同名 top-level/nested message 加 message oneof，约束 FQN 与 prost module binding。
message NestedOneofRoot {
  message Payload {
    string nested_value = 1;
  }

  oneof selected {
    Payload payload = 1;
  }
}

// nested message 与 oneof group 同名，约束 prost 的 `ChoiceOneOf` 消歧绑定。
message OneofNestedNameRoot {
  message Choice {
    string value = 1;
  }

  oneof choice {
    Choice nested_choice = 1;
  }
}
