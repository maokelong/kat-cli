syntax = "proto2";

package fixture.protobuf_source.unsupported.extension_shape;

message ExtensionSubject {
  extensions 100 to 199;
}

extend ExtensionSubject {
  optional string fixture_note = 100;
}

message ExtensionContainer {
  optional ExtensionSubject subject = 1;
}

message ExtensionReachableRoot {
  optional ExtensionContainer container = 1;
}

// 绑定该 root 时，ExtensionSubject 与 extension 位于 reachable closure 外，不应阻塞。
message ExtensionUnreachableRoot {
  optional string value = 1;
}
