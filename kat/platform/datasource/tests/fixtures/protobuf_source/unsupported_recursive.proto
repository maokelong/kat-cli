syntax = "proto3";

package fixture.protobuf_source.unsupported.recursive_shape;

message RecursiveNode {
  string value = 1;
  RecursiveNode next = 2;
}

message RecursiveReachableRoot {
  RecursiveNode node = 1;
}

// 绑定该 root 时，RecursiveNode 位于 reachable closure 外，不应阻塞。
message RecursiveUnreachableRoot {
  string value = 1;
}
