syntax = "proto3";

package fixture.protobuf_source.valid;

enum Lifecycle {
  LIFECYCLE_UNSPECIFIED = 0;
  LIFECYCLE_STARTED = 1;
  LIFECYCLE_STOPPED = 2;
}

// 可独立绑定为 root，覆盖所有 scalar groups、string、bytes、enum 与 proto3 optional。
message ScalarMatrix {
  double double_value = 1;
  float float_value = 2;
  int32 int32_value = 3;
  int64 int64_value = 4;
  uint32 uint32_value = 5;
  uint64 uint64_value = 6;
  sint32 sint32_value = 7;
  sint64 sint64_value = 8;
  fixed32 fixed32_value = 9;
  fixed64 fixed64_value = 10;
  sfixed32 sfixed32_value = 11;
  sfixed64 sfixed64_value = 12;
  bool bool_value = 13;
  string string_value = 14;
  bytes bytes_value = 15;
  Lifecycle lifecycle = 16;
  optional int32 optional_count = 17;
  optional string optional_label = 18;
  optional bytes optional_bytes = 19;
  optional Lifecycle optional_lifecycle = 20;
}

message LeafValue {
  int32 code = 1;
  string label = 2;
  bytes payload = 3;
}

message NullableInner {
  LeafValue leaf = 1;
  uint64 inner_value = 2;
}

message NullableOuter {
  NullableInner inner = 1;
  uint32 outer_value = 2;
}

// 标量、bytes、enum variant 留在 containing row；message variant 形成 child relation。
message OneofMatrix {
  oneof selected {
    sint64 scalar_value = 1;
    bytes bytes_value = 2;
    Lifecycle enum_value = 3;
    LeafValue message_value = 4;
  }
}

// 不含 message variant 的 oneof 留在 nullable Struct 中，不形成 child relation。
message ScalarOneofOnly {
  oneof selected {
    sint64 scalar = 1;
    bytes payload = 2;
    Lifecycle lifecycle = 3;
  }
}

message InlineOneofRoot {
  ScalarOneofOnly nested = 1;
}

message RepeatedMatrix {
  repeated fixed64 scalar_values = 1;
  repeated bytes bytes_values = 2;
  repeated Lifecycle enum_values = 3;
  repeated LeafValue message_values = 4;
}

message RelationChild {
  uint32 id = 1;
  string name = 2;
}

message RelationContainer {
  string label = 1;
  repeated RelationChild children = 2;
}

message DeepRepeatedRoot {
  repeated RelationContainer containers = 1;
}

message FullShapeRoot {
  ScalarMatrix scalars = 1;
  NullableOuter nullable_outer = 2;
  OneofMatrix oneof_matrix = 3;
  RepeatedMatrix repeated_matrix = 4;
  RelationContainer relation_container = 5;
}

message EmptyRoot {}
