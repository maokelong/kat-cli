syntax = "proto3";

package ftrace2parquet;

message TextFtraceEvent {
  string clock_domain = 1;
  uint64 clock_value = 2;
  uint32 cpu = 3;
  string emitter_thread_name = 4;
  int32 emitter_thread_id = 5;
  optional int32 emitter_process_id = 6;
  string context_flags = 7;

  oneof payload {
    SchedSwitch sched_switch = 8;
    SchedWakeup sched_wakeup = 9;
    SchedWakeupNew sched_wakeup_new = 10;
    TracingMarkWrite tracing_mark_write = 11;
  }
}

message SchedSwitch {
  string previous_thread_name = 1;
  int32 previous_thread_id = 2;
  int32 previous_priority = 3;
  string previous_state = 4;
  string next_thread_name = 5;
  int32 next_thread_id = 6;
  int32 next_priority = 7;
}

message SchedWakeup {
  string thread_name = 1;
  int32 thread_id = 2;
  int32 priority = 3;
  uint32 target_cpu = 4;
}

message SchedWakeupNew {
  string thread_name = 1;
  int32 thread_id = 2;
  int32 priority = 3;
  uint32 target_cpu = 4;
}

message TracingMarkWrite {
  string content = 1;
}
