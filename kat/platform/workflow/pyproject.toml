[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kat-workflow"
version = "0.1.1-rc.1"
requires-python = ">=3.14,<3.15"
dependencies = [
    "click==8.4.2",
    "datafusion==54.0.0",
    "defusedxml==0.7.1",
    "openpyxl==3.1.5",
    "psycopg[binary]==3.3.4",
    "pyarrow==24.0.0",
    "pytest==9.1.1",
    "tzdata==2026.3; sys_platform == 'win32'",
    "XlsxWriter==3.2.9",
]

[tool.setuptools]
packages = ["kat", "kat.common", "kat.common.sql", "_kat_runtime"]
package-dir = { kat = "api", "kat.common" = "common", "_kat_runtime" = "runtime" }
