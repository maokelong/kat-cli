[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kat-workflow"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["click==8.4.2"]

[tool.setuptools]
packages = ["kat", "_kat_runtime"]
package-dir = { kat = "api", "_kat_runtime" = "runtime" }
