syntax = "proto3";

package kat.network_data;

option java_package = "ohos.devtools.datasources.transport.grpc.service";
option optimize_for = LITE_RUNTIME;

message NetworkConfig {
    repeated int32 pid = 1;
    string test_file = 2;
    int32 single_pid = 3;
    // Data collection in program startup stage
    string startup_process_name = 4;
    // Data collection in program restart
    string restart_process_name = 5;
}
