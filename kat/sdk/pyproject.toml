[build-system]
requires = [
    "setuptools==80.9.0",
    "griffe2md==1.5.0",
    "griffelib==2.3.0",
    "markdown-it-py==4.2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "kat-sdk"
version = "0.1.1"
description = "KAT 官方公共 Provider、Workflow 与领域公共库"
requires-python = ">=3.14,<3.15"
dependencies = [
    "kat-workflow>=0.1.1rc13,<0.2",
    "kat-datasource>=0.1.1rc12,<0.2",
]

[tool.setuptools]
include-package-data = false
packages = ["kat_sdk", "kat_sdk.providers", "kat_sdk.helpers", "kat_sdk.helpers.demo"]
package-dir = { kat_sdk = "." }

[tool.setuptools.package-data]
kat_sdk = ["pack.toml", "knowledge/**/*.md", "workflows/**/*.py"]

[tool.setuptools.cmdclass]
build_py = "sdk_build.BuildPy"
