[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kat-python-runtime"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "kat-python-sdk==0.1.0",
  "datafusion==54.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kat_runtime*"]
