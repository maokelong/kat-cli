id: openharmony.query.empty_path_edges
uses: query

requires:
  tables: {}

context:
  subscribes: {}
  publishes: {}

output:
  table: selected_path_edges

sql: |
  SELECT
    CAST(NULL AS BIGINT) AS path_id,
    CAST(NULL AS BIGINT) AS iteration,
    CAST(NULL AS TEXT) AS from_anchor_kind,
    CAST(NULL AS BIGINT) AS from_itid,
    CAST(NULL AS BIGINT) AS from_tid,
    CAST(NULL AS TEXT) AS from_thread_name,
    CAST(NULL AS BIGINT) AS from_interval_start_ts,
    CAST(NULL AS BIGINT) AS from_interval_end_ts,
    CAST(NULL AS BIGINT) AS from_callstack_id,
    CAST(NULL AS BIGINT) AS to_itid,
    CAST(NULL AS BIGINT) AS to_tid,
    CAST(NULL AS TEXT) AS to_thread_name,
    CAST(NULL AS TEXT) AS edge_kind,
    CAST(NULL AS BIGINT) AS edge_row_id,
    CAST(NULL AS BIGINT) AS callstack_row_id,
    CAST(NULL AS BIGINT) AS parent_callstack_row_id,
    CAST(NULL AS TEXT) AS evidence_name,
    CAST(NULL AS BIGINT) AS edge_start_ts,
    CAST(NULL AS BIGINT) AS edge_end_ts,
    CAST(NULL AS BIGINT) AS raw_dur,
    CAST(NULL AS BIGINT) AS critical_cost_ns,
    CAST(NULL AS TEXT) AS cost_kind,
    CAST(NULL AS BIGINT) AS depth,
    CAST(NULL AS BIGINT) AS wait_state_row_id,
    CAST(NULL AS BIGINT) AS wakeup_row_id,
    CAST(NULL AS BIGINT) AS wakeup_from_itid,
    CAST(NULL AS BIGINT) AS wakeup_from_tid,
    CAST(NULL AS TEXT) AS wakeup_from_thread_name,
    CAST(NULL AS BIGINT) AS priority,
    CAST(NULL AS BIGINT) AS selection_rank
  WHERE 1 = 0;
