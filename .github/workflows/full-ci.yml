name: Full CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - labeled
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  full-test:
    name: full-test (${{ matrix.os }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Workflow Host wheel
        run: python -m pip install --disable-pip-version-check ./kat/platform/workflow

      - name: Test
        run: cargo test --locked

      - name: Test Workflow Host
        run: python -I -B -m unittest discover -s kat/platform/workflow/tests
