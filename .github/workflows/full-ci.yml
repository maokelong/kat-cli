name: Full CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - labeled
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-test:
    name: full-test (${{ matrix.os }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build and install Workflow Host wheel
        run: |
          python -m pip wheel --disable-pip-version-check --wheel-dir target/workflow-wheel ./kat/platform/workflow
          python -c "import glob, subprocess, sys; wheel = glob.glob('target/workflow-wheel/kat_workflow-*.whl')[0]; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--disable-pip-version-check', '--no-index', '--find-links', 'target/workflow-wheel', wheel])"
          python -c "import glob, os, sys; from pathlib import Path; wheel = Path(glob.glob('target/workflow-wheel/kat_workflow-*.whl')[0]).resolve(); open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write(f'KAT_TEST_PYTHON={sys.executable}\nKAT_TEST_WORKFLOW_WHEEL={wheel}\n')"

      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked

      - name: Test (system linker on Linux)
        if: runner.os == 'Linux'
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
          RUSTFLAGS: -C linker-features=-lld
        run: cargo test --workspace --locked --jobs 1

      - name: Test real Workflow Host vertical slice
        run: cargo test --locked -p kat-cli --test inspect targeted_pack_inspection_runs_real_installed_workflow_host -- --ignored --exact

      - name: Test Workflow Host
        run: python -I -B -m unittest discover -s kat/platform/workflow/tests
