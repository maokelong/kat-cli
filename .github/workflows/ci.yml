name: CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check commit identities
        if: github.event_name == 'push'
        run: python .github/scripts/pr_guard.py --identity-only --base "${{ github.event.before }}" --head "${{ github.sha }}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo check --locked

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        run: python -m pip install datafusion==54.0.0 pytest

      - name: Prepare pytest temp directory
        run: mkdir -p .pytest-tmp

      - name: Test Python SDK, Runtime, and Pack contracts
        run: >-
          python -m pytest
          python/tests/test_sdk_runtime_contract.py
          python/tests/test_runtime_validation.py
          python/tests/test_worker_error_contract.py
          python/tests/test_openharmony_critical_path_pack.py
          -q -p no:cacheprovider --basetemp .pytest-tmp/ci
