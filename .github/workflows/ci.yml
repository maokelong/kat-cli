name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked

      - name: Check trace_streamer_rust
        working-directory: src/trace_streamer_rust
        run: cargo check --locked --workspace

      - name: Test trace_streamer_rust
        working-directory: src/trace_streamer_rust
        run: cargo test --locked --workspace
