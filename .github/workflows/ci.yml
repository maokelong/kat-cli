name: CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check commit identities
        if: github.event_name == 'push'
        run: python .github/scripts/pr_guard.py --identity-only --base "${{ github.event.before }}" --head "${{ github.sha }}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 默认门禁刻意只验证编译；全量测试通过 Full CI 显式触发，见 #180。
      - name: Check
        run: cargo check --workspace --locked
