name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check commit identities
        if: github.event_name == 'push'
        run: python .github/scripts/pr_guard.py --identity-only --base "${{ github.event.before }}" --head "${{ github.sha }}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked
