# Native Builder adapter called by dist's local-artifact phase.
name: Build Windows Platform Payload

on:
  workflow_call:
    inputs:
      cold-build:
        required: false
        type: boolean
        default: false
      expected-version:
        description: Expected normalized version of both private wheels.
        required: true
        type: string
      workflow-wheel-sha256:
        description: SHA-256 of the downloaded Workflow Host wheel.
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-payload:
    name: Windows x86_64 Payload
    runs-on: windows-2025

    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Read locked Rust toolchain
        id: rust-toolchain
        shell: pwsh
        run: |
          $channel = python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])'
          "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: x86_64-pc-windows-msvc

      - name: Install sccache
        id: sccache
        if: ${{ !inputs['cold-build'] }}
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Enable sccache
        if: steps.sccache.outcome == 'success'
        shell: pwsh
        run: |
          "SCCACHE_GHA_ENABLED=true" >> $env:GITHUB_ENV
          "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> $env:GITHUB_ENV
          "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install locked Builder dependencies
        shell: pwsh
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-deps
          --only-binary=:all:
          --require-hashes
          -r build/requirements-builder.lock.txt

      - name: Download the single Workflow Host wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kat-workflow-wheel
          path: target/kat/workflow-wheel

      - name: Build native Datasource wheel and locked Payload
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs['expected-version'] }}
          WORKFLOW_WHEEL_SHA256: ${{ inputs['workflow-wheel-sha256'] }}
        run: |
          $ErrorActionPreference = "Stop"
          $workflowWheels = @(Get-ChildItem "target/kat/workflow-wheel" -Filter "*.whl" -File)
          if ($workflowWheels.Count -ne 1) { throw "expected exactly one Workflow Host wheel" }
          python build/build_datasource_wheel.py `
            --python (Get-Command python).Source `
            --platform windows-x86_64 `
            --expected-version $env:EXPECTED_VERSION `
            --output "target/kat/datasource-wheel"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $datasourceWheels = @(Get-ChildItem "target/kat/datasource-wheel" -Filter "*.whl" -File)
          if ($datasourceWheels.Count -ne 1) { throw "expected exactly one Datasource wheel" }
          $datasourceSha256 = (Get-FileHash -Algorithm SHA256 $datasourceWheels[0].FullName).Hash.ToLowerInvariant()
          python -m venv "target/kat/datasource-wheel-test"
          $testPython = (Resolve-Path "target/kat/datasource-wheel-test/Scripts/python.exe").Path
          & $testPython -m pip install --disable-pip-version-check --no-deps --no-index $datasourceWheels[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testPython -I -B "kat/platform/datasource/tests/python/test_hitrace_api.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testPython -I -B "kat/platform/datasource/tests/python/test_text_ftrace_api.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build/build_windows_payload.py `
            --output "target/kat/payloads/windows-x86_64" `
            --workflow-wheel $workflowWheels[0].FullName `
            --workflow-wheel-version $env:EXPECTED_VERSION `
            --workflow-wheel-sha256 $env:WORKFLOW_WHEEL_SHA256 `
            --datasource-wheel $datasourceWheels[0].FullName `
            --datasource-wheel-version $env:EXPECTED_VERSION `
            --datasource-wheel-sha256 $datasourceSha256
          New-Item -ItemType Directory -Force "target/distrib/.payload-inputs" | Out-Null
          tar -czf "target/distrib/.payload-inputs/windows-x86_64.tar.gz" `
            -C "target/kat/payloads" windows-x86_64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload private Payload input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # dist 0.32 会收集 artifacts-*；私有 local input 必须避开此前缀。
          name: kat-windows-payload
          path: target/distrib/
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
