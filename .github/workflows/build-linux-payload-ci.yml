# Native Builder adapter called by dist's local-artifact phase.
name: Build Linux Platform Payload

on:
  workflow_call:
    inputs:
      cold-build:
        required: false
        type: boolean
        default: false
      expected-version:
        description: Expected normalized SDK version.
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-payload:
    name: Linux x86_64 Payload
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:b04887b645dde99b9e955aeae3ff4da414992d0bd88259f046295b56361c5614

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read locked Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(/opt/python/cp314-cp314/bin/python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: x86_64-unknown-linux-gnu

      - name: Install sccache
        id: sccache
        if: ${{ !inputs['cold-build'] }}
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Enable sccache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install locked Builder dependencies
        shell: bash
        run: >-
          /opt/python/cp314-cp314/bin/python -m pip install
          --disable-pip-version-check
          --no-deps
          --only-binary=:all:
          --require-hashes
          -r build/requirements-builder.lock.txt

      - name: Build native SDK wheel and locked Payload
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs['expected-version'] }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          test -x /opt/python/cp314-cp314/bin/python
          /opt/python/cp314-cp314/bin/python build/build_sdk_wheel.py \
            --python /opt/python/cp314-cp314/bin/python \
            --platform linux-x86_64 \
            --expected-version "$EXPECTED_VERSION" \
            --output target/kat/sdk-wheel
          sdk_wheel=$(find target/kat/sdk-wheel -maxdepth 1 -type f -name 'kat_sdk-*.whl' -print)
          test "$(printf '%s\n' "$sdk_wheel" | sed '/^$/d' | wc -l)" -eq 1
          sdk_sha256=$(sha256sum "$sdk_wheel" | cut -d ' ' -f 1)
          /opt/python/cp314-cp314/bin/python -m venv target/kat/sdk-wheel-test
          test_python=target/kat/sdk-wheel-test/bin/python
          "$test_python" -m pip install --disable-pip-version-check --only-binary=:all: "$sdk_wheel"
          "$test_python" -I -B kat/sdk/tests/providers/decoding/test_hitrace_api.py -v
          "$test_python" -I -B kat/sdk/tests/providers/decoding/test_text_ftrace_api.py -v
          /opt/python/cp314-cp314/bin/python build/build_linux_payload.py \
            --output target/kat/payloads/linux-x86_64 \
            --sdk-wheel "$sdk_wheel" \
            --sdk-wheel-version "$EXPECTED_VERSION" \
            --sdk-wheel-sha256 "$sdk_sha256"
          mkdir -p target/distrib/.payload-inputs
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --format=posix --pax-option=delete=atime,delete=ctime \
            -C target/kat/payloads -czf \
            target/distrib/.payload-inputs/linux-x86_64.tar.gz linux-x86_64

      - name: Upload private Payload input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # dist 0.32 会收集 artifacts-*；私有 local input 必须避开此前缀。
          name: kat-linux-payload
          path: target/distrib/
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
