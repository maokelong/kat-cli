# CI-only verification for an exact commit. Versioning, checksums, hosting, and
# GitHub Releases remain owned by dist as decided in ADR-0002.
name: Verify dual-platform Skill payload

on:
  workflow_dispatch:
    inputs:
      cold-build:
        description: 本次运行跳过 Rust 编译缓存
        required: false
        type: boolean
        default: false
  pull_request:
    types:
      - labeled
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-wheel:
    name: Build the single Workflow Host wheel
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Build and hash the private wheel once
        run: >-
          python build/build_workflow_wheel.py
          --output target/kat/workflow-wheel

      - name: Upload the private wheel input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kat-workflow-wheel
          path: target/kat/workflow-wheel/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  requirements-locks:
    name: Verify generated platform requirement locks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install locked uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Regenerate both platform locks
        shell: bash
        run: |
          set -euo pipefail
          read -r python_version uv_version < <(
            python -c 'import json; d=json.load(open("build/runtime-inputs.json")); print(d["python"]["version"], d["uv"]["version"])'
          )
          test "$(uv --version | cut -d ' ' -f 2)" = "$uv_version"
          uv pip compile kat/platform/workflow/pyproject.toml \
            --python-version "$python_version" \
            --python-platform x86_64-unknown-linux-gnu \
            --only-binary :all: \
            --generate-hashes \
            --no-config \
            --no-progress \
            --output-file build/requirements-linux.lock.txt
          uv pip compile kat/platform/workflow/pyproject.toml \
            --python-version "$python_version" \
            --python-platform x86_64-pc-windows-msvc \
            --only-binary :all: \
            --generate-hashes \
            --no-config \
            --no-progress \
            --output-file build/requirements-windows.lock.txt
          git diff --exit-code -- \
            build/requirements-linux.lock.txt \
            build/requirements-windows.lock.txt

  builder-tests:
    name: Builder tests (${{ matrix.os }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    needs: requirements-locks
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install locked Builder dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-deps
          --only-binary=:all:
          --require-hashes
          -r build/requirements-builder.lock.txt

      - name: Test Builder and Assembly contracts
        run: python -I -B -m unittest discover -s build/tests -v

  linux-payload:
    name: Build Linux payload
    needs:
      - workflow-wheel
      - builder-tests
    uses: ./.github/workflows/build-linux-payload-ci.yml
    with:
      workflow-wheel-artifact: kat-workflow-wheel
      cold-build: ${{ github.event_name == 'workflow_dispatch' && inputs['cold-build'] }}

  windows-payload:
    name: Build Windows payload
    needs:
      - workflow-wheel
      - builder-tests
    uses: ./.github/workflows/build-windows-payload-ci.yml
    with:
      workflow-wheel-artifact: kat-workflow-wheel
      cold-build: ${{ github.event_name == 'workflow_dispatch' && inputs['cold-build'] }}

  assemble:
    name: Assemble the dual-platform Skill
    needs:
      - linux-payload
      - windows-payload
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download both black-box payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-kat-*-payload
          path: target/distrib
          merge-multiple: true

      - name: Extract and assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/kat/payloads
          tar -xzf target/distrib/.payload-inputs/linux-x86_64.tar.gz -C target/kat/payloads
          tar -xzf target/distrib/.payload-inputs/windows-x86_64.tar.gz -C target/kat/payloads
          python build/assemble_skill.py \
            --skill-source kat/skill \
            --packs kat/packs \
            --linux-payload target/kat/payloads/linux-x86_64 \
            --windows-payload target/kat/payloads/windows-x86_64 \
            --output target/kat/final-skill
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --format=posix --pax-option=delete=atime,delete=ctime \
            -C target/kat -czf target/kat/kat-dual-platform-skill.tar.gz final-skill

      - name: Upload the assembled Skill
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kat-dual-platform-skill
          path: target/kat/kat-dual-platform-skill.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  linux-smoke:
    name: Linux glibc 2.28 relocated payload smoke
    needs: assemble
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download assembled Skill
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kat-dual-platform-skill
          path: target/kat/artifact

      - name: Relocate and cross the public CLI-to-Host seam
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/kat/smoke-input
          tar -xzf target/kat/artifact/kat-dual-platform-skill.tar.gz \
            -C target/kat/smoke-input
          image='almalinux@sha256:dd9015a46bf86d46801080d9f37990528b2072b1d4a3f3851c6a5a79088adf82'
          docker pull "$image"
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            --tmpfs /work:exec,size=4g \
            "$image" \
            /bin/bash -c '
              set -euo pipefail
              mkdir -p /work/home /work/tmp /work/xdg-data
              export HOME=/work/home
              export XDG_DATA_HOME=/work/xdg-data
              export PATH=
              export PYTHONHOME=/work/poison-home
              export PYTHONPATH=/work/poison-path
              export PYTHONUSERBASE=/work/poison-user
              export TMPDIR=/work/tmp
              unset KAT_DATA_HOME
              payload=/repo/target/kat/smoke-input/final-skill/scripts/targets/linux-x86_64
              response=$("$payload/kat" inspect --pack kat-openharmony-thread-cpu-time)
              if [[ $response != \{\"status\":\"success\",* ]]; then
                echo "unexpected KAT Response: $response" >&2
                exit 1
              fi
            '

  windows-smoke:
    name: Windows relocated payload smoke
    needs: assemble
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download assembled Skill
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kat-dual-platform-skill
          path: target/kat/artifact

      - name: Relocate and cross the public CLI-to-Host seam
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "target/kat/smoke-input" | Out-Null
          tar -xzf "target/kat/artifact/kat-dual-platform-skill.tar.gz" `
            -C "target/kat/smoke-input"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $skill = "target/kat/smoke-input/final-skill"
          $payload = "$skill/scripts/targets/windows-x86_64"
          $env:HOME = Join-Path $env:RUNNER_TEMP "kat-payload-home"
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "kat-payload-appdata"
          New-Item -ItemType Directory -Force $env:HOME, $env:APPDATA | Out-Null
          $env:PATH = ""
          $env:PYTHONHOME = Join-Path $env:RUNNER_TEMP "poison-home"
          $env:PYTHONPATH = Join-Path $env:RUNNER_TEMP "poison-path"
          $env:PYTHONUSERBASE = Join-Path $env:RUNNER_TEMP "poison-user"
          Remove-Item Env:KAT_DATA_HOME -ErrorAction SilentlyContinue
          $response = & "$payload/kat.exe" inspect --pack kat-openharmony-thread-cpu-time |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($response.status -ne "success") {
            throw "unexpected KAT Response status: $($response.status)"
          }
