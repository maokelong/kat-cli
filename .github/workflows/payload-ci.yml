# Global artifact adapter called by dist after both native payload jobs complete.
name: Assemble and verify KAT Skill

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble the release Skill
    runs-on: ubuntu-24.04
    env:
      PLAN: ${{ inputs.plan }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download Linux payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kat-linux-payload
          path: target/distrib

      - name: Download Windows payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kat-windows-payload
          path: target/distrib

      - name: Extract, assemble, and checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -er '.releases | map(.app_version) | unique | if length == 1 then .[0] else error("release versions are not unique") end' <<< "$PLAN")
          mkdir -p target/kat/payloads target/distrib/release
          tar -xzf target/distrib/.payload-inputs/linux-x86_64.tar.gz -C target/kat/payloads
          tar -xzf target/distrib/.payload-inputs/windows-x86_64.tar.gz -C target/kat/payloads
          python build/assemble_skill.py \
            --skill-source kat/skill \
            --packs kat/packs \
            --linux-payload target/kat/payloads/linux-x86_64 \
            --windows-payload target/kat/payloads/windows-x86_64 \
            --output target/kat/release/kat
          artifact="kat-skill-${version}.tar.gz"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --format=posix --pax-option=delete=atime,delete=ctime \
            -C target/kat/release -czf "target/distrib/release/${artifact}" kat
          (
            cd target/distrib/release
            sha256sum "$artifact" > "${artifact}.sha256"
          )
          echo "name=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload the release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # dist 0.32 会收集 artifacts-*；最终公开输入必须保留此前缀。
          name: artifacts-kat-skill
          path: target/distrib/release/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}

  verify-release-artifact:
    name: Verify the release artifact contract
    needs: assemble
    runs-on: ubuntu-24.04

    steps:
      - name: Download assembled Skill
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: artifacts-kat-skill
          path: target/kat/artifact

      - name: Verify the exact asset set and SHA-256
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.assemble.outputs.artifact-name }}
        run: |
          set -euo pipefail
          cd target/kat/artifact
          expected=$(printf '%s\n' "$ARTIFACT_NAME" "${ARTIFACT_NAME}.sha256" | sort)
          actual=$(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test "$actual" = "$expected"
          sha256sum -c "${ARTIFACT_NAME}.sha256"

  linux-smoke:
    name: Linux release Skill full-loop smoke
    needs: assemble
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download assembled Skill
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: artifacts-kat-skill
          path: target/kat/artifact

      - name: Relocate and verify Import to Query
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.assemble.outputs.artifact-name }}
        run: |
          set -euo pipefail
          mkdir -p target/kat/smoke-input
          tar -xzf "target/kat/artifact/${ARTIFACT_NAME}" -C target/kat/smoke-input
          image='almalinux@sha256:dd9015a46bf86d46801080d9f37990528b2072b1d4a3f3851c6a5a79088adf82'
          docker pull "$image"
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            --tmpfs /work:exec,size=4g \
            "$image" \
            /bin/bash -c '
              set -euo pipefail
              mkdir -p /work/home /work/tmp /work/xdg-data
              export HOME=/work/home
              export XDG_DATA_HOME=/work/xdg-data
              export PATH=
              export PYTHONHOME=/work/poison-home
              export PYTHONPATH=/work/poison-path
              export PYTHONUSERBASE=/work/poison-user
              export TMPDIR=/work/tmp
              unset KAT_DATA_HOME
              skill=/repo/target/kat/smoke-input/kat
              payload=$skill/scripts/targets/linux-x86_64
              cli=$payload/kat
              python=$payload/python/bin/python3
              pack=$skill/assets/packs/kat-openharmony-thread-cpu-time
              fixture=/repo/kat/platform/datasource/tests/fixtures/trace-streamer-thread-cpu-time.db
              "$cli" import trace-streamer --database "$fixture" --dataset /work/dataset >/work/import.json
              "$cli" inspect --dataset /work/dataset >/work/inspect-dataset.json
              "$cli" inspect --pack kat-openharmony-thread-cpu-time --pack-dir "$pack" >/work/inspect-pack.json
              "$cli" test --pack-dir "$pack" >/work/test.json
              "$cli" run --pack kat-openharmony-thread-cpu-time --workflow thread-cpu-time --pack-dir "$pack" --dataset /work/dataset >/work/run.json
              run_id=$(/usr/bin/env -u PYTHONHOME -u PYTHONPATH -u PYTHONUSERBASE \
                "$python" -c "import json; print(json.load(open(\"/work/run.json\"))[\"result\"][\"run_id\"])")
              "$cli" query --run "$run_id" --sql "SELECT COUNT(*) AS rows FROM output.thread_cpu_time_by_cpu" >/work/query.json
              /usr/bin/env -u PYTHONHOME -u PYTHONPATH -u PYTHONUSERBASE \
                "$python" -c "import json; files=[\"import\",\"inspect-dataset\",\"inspect-pack\",\"test\",\"run\",\"query\"]; assert all(json.load(open(\"/work/\"+name+\".json\"))[\"status\"]==\"success\" for name in files)"
            '

  windows-smoke:
    name: Windows candidate - builder-image archive smoke
    needs: assemble
    runs-on: windows-2025

    steps:
      - name: Record the candidate validation boundary
        shell: pwsh
        run: |
          @'
          ### Windows candidate validation boundary

          当前 job 运行在 GitHub 托管的 `windows-2025` builder image，只验证候选归档的装配、重定位、Bundled Python 选择与操作链路。
          它不构成 #143 要求的 clean-client 验收，也不证明 Windows 10/11 客户端无需系统级 VC Runtime。
          '@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download assembled Skill
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: artifacts-kat-skill
          path: target/kat/artifact

      - name: Relocate and verify Import to Query on the builder image
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ needs.assemble.outputs.artifact-name }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force "target/kat/smoke-input" | Out-Null
          tar -xzf "target/kat/artifact/$env:ARTIFACT_NAME" -C "target/kat/smoke-input"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $skill = (Resolve-Path "target/kat/smoke-input/kat").Path
          $payload = Join-Path $skill "scripts/targets/windows-x86_64"
          $cli = Join-Path $payload "kat.exe"
          $pack = Join-Path $skill "assets/packs/kat-openharmony-thread-cpu-time"
          $fixture = (Resolve-Path "kat/platform/datasource/tests/fixtures/trace-streamer-thread-cpu-time.db").Path
          $work = Join-Path $env:RUNNER_TEMP "kat-release-smoke"
          $dataset = Join-Path $work "dataset"
          $env:HOME = Join-Path $work "home"
          $env:APPDATA = Join-Path $work "appdata"
          New-Item -ItemType Directory -Force $work, $env:HOME, $env:APPDATA | Out-Null
          $env:PATH = ""
          $env:PYTHONHOME = Join-Path $work "poison-home"
          $env:PYTHONPATH = Join-Path $work "poison-path"
          $env:PYTHONUSERBASE = Join-Path $work "poison-user"
          Remove-Item Env:KAT_DATA_HOME -ErrorAction SilentlyContinue
          $responses = @()
          $responses += (& $cli import trace-streamer --database $fixture --dataset $dataset | ConvertFrom-Json)
          $responses += (& $cli inspect --dataset $dataset | ConvertFrom-Json)
          $responses += (& $cli inspect --pack kat-openharmony-thread-cpu-time --pack-dir $pack | ConvertFrom-Json)
          $responses += (& $cli test --pack-dir $pack | ConvertFrom-Json)
          $run = & $cli run --pack kat-openharmony-thread-cpu-time --workflow thread-cpu-time --pack-dir $pack --dataset $dataset | ConvertFrom-Json
          $responses += $run
          $responses += (& $cli query --run $run.result.run_id --sql "SELECT COUNT(*) AS rows FROM output.thread_cpu_time_by_cpu" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($responses.Count -ne 6 -or ($responses | Where-Object status -ne "success").Count -ne 0) {
            throw "release Skill full-loop smoke did not return only success responses"
          }
