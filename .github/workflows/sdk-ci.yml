name: Build and verify pip SDK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "kat/sdk/**"
      - "kat/platform/**"
      - "kat/packs/**"
      - "build/**"
      - "Cargo.*"
      - ".github/workflows/sdk-ci.yml"

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:b04887b645dde99b9e955aeae3ff4da414992d0bd88259f046295b56361c5614
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select CPython 3.14
        run: echo "/opt/python/cp314-cp314/bin" >> "$GITHUB_PATH"
      - name: Read locked Rust toolchain
        id: rust
        shell: python {0}
        run: |
          import os, tomllib
          with open("rust-toolchain.toml", "rb") as source:
              channel = tomllib.load(source)["toolchain"]["channel"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"channel={channel}\n")
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - name: Install Builder dependencies
        run: python -m pip install --require-hashes --no-deps -r build/requirements-builder.lock.txt
      - name: Build SDK without a bundled Python
        shell: python {0}
        run: |
          import os, pathlib, subprocess, sys, tomllib
          def run(*args, **kwargs):
              subprocess.run([str(arg) for arg in args], check=True, **kwargs)
          run(sys.executable, "build/verify_release_versions.py")
          with open("release/kat/dist.toml", "rb") as source:
              version = tomllib.load(source)["package"]["version"].replace("-rc.", "rc")
          platform = "windows-x86_64" if os.name == "nt" else "linux-x86_64"
          env = dict(os.environ)
          if os.name == "nt":
              env["RUSTFLAGS"] = "-C target-feature=+crt-static"
          run("cargo", "build", "--release", "--locked", "-p", "kat-cli", env=env)
          run(sys.executable, "build/build_sdk_wheel.py", "--python", sys.executable,
              "--platform", platform, "--expected-version", version, "--output", "target/sdk/wheels")
          sdk, = pathlib.Path("target/sdk/wheels").glob("kat_sdk-*.whl")
          run(sys.executable, "-m", "venv", "target/sdk/api-check")
          api_python = pathlib.Path("target/sdk/api-check") / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          run(api_python, "-m", "pip", "install", "--only-binary=:all:", sdk)
          run(api_python, "-m", "pip", "check")
          run(api_python, "-I", "-B", "kat/sdk/tests/packaging/test_knowledge.py", "-v")
          run(api_python, "-I", "-B", "build/fixtures/verify_installed_sdk.py")
      - name: Verify pip installation and upgrade in the same environment
        run: python build/fixtures/verify_sdk_upgrade.py --wheels target/sdk/wheels --work target/sdk/upgrade-check --cli target/release/kat
      - name: Upload unified SDK and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kat-sdk-linux-x86_64
          path: |
            target/sdk/wheels/kat_sdk-*.whl
            target/sdk/wheels/kat_sdk-*.whl.sha256
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Read locked Rust toolchain
        id: rust
        shell: python {0}
        run: |
          import os, tomllib
          with open("rust-toolchain.toml", "rb") as source:
              channel = tomllib.load(source)["toolchain"]["channel"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"channel={channel}\n")
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - name: Install Builder dependencies
        run: python -m pip install --require-hashes --no-deps -r build/requirements-builder.lock.txt
      - name: Build SDK without a bundled Python
        shell: python {0}
        run: |
          import os, pathlib, subprocess, sys, tomllib
          def run(*args, **kwargs):
              subprocess.run([str(arg) for arg in args], check=True, **kwargs)
          run(sys.executable, "build/verify_release_versions.py")
          with open("release/kat/dist.toml", "rb") as source:
              version = tomllib.load(source)["package"]["version"].replace("-rc.", "rc")
          platform = "windows-x86_64" if os.name == "nt" else "linux-x86_64"
          env = dict(os.environ)
          if os.name == "nt":
              env["RUSTFLAGS"] = "-C target-feature=+crt-static"
          run("cargo", "build", "--release", "--locked", "-p", "kat-cli", env=env)
          run(sys.executable, "build/build_sdk_wheel.py", "--python", sys.executable,
              "--platform", platform, "--expected-version", version, "--output", "target/sdk/wheels")
          sdk, = pathlib.Path("target/sdk/wheels").glob("kat_sdk-*.whl")
          run(sys.executable, "-m", "venv", "target/sdk/api-check")
          api_python = pathlib.Path("target/sdk/api-check") / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          run(api_python, "-m", "pip", "install", "--only-binary=:all:", sdk)
          run(api_python, "-m", "pip", "check")
          run(api_python, "-I", "-B", "kat/sdk/tests/packaging/test_knowledge.py", "-v")
          run(api_python, "-I", "-B", "build/fixtures/verify_installed_sdk.py")
      - name: Verify pip installation and upgrade in the same environment
        run: python build/fixtures/verify_sdk_upgrade.py --wheels target/sdk/wheels --work target/sdk/upgrade-check --cli target/release/kat.exe
      - name: Upload unified SDK and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kat-sdk-windows-x86_64
          path: |
            target/sdk/wheels/kat_sdk-*.whl
            target/sdk/wheels/kat_sdk-*.whl.sha256
          if-no-files-found: error
          retention-days: 7
