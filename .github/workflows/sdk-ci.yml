name: SDK CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Build SDK wheel and checksum
        run: |
          python -m pip install build==1.6.1
          python build/build_sdk_wheel.py --output target/sdk-wheel
      - name: Upload exact SDK candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kat-sdk-candidate
          path: target/sdk-wheel/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  installed:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Read locked Rust toolchain
        id: rust
        shell: bash
        run: |
          echo "channel=$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - name: Download exact SDK candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kat-sdk-candidate
          path: target/sdk-wheel
      - name: Build matching framework and native dependency
        shell: bash
        run: |
          python -m pip install build==1.6.1 maturin==1.15.0
          python -m pip wheel --wheel-dir target/host-wheels ./kat/platform/workflow
          python -m pip wheel --no-deps --wheel-dir target/host-wheels ./kat/platform/datasource
          if [ "$RUNNER_OS" = "Linux" ]; then export RUSTFLAGS="-C linker-features=-lld"; fi
          CARGO_PROFILE_DEV_DEBUG=0 cargo build --locked -p kat-cli --jobs 1
      - name: Verify checksum, installation, discovery and upgrade
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, subprocess, sys
          from pathlib import Path
          sdk, = Path("target/sdk-wheel").glob("*.whl")
          expected = Path(str(sdk) + ".sha256").read_text().split()[0]
          assert hashlib.sha256(sdk.read_bytes()).hexdigest() == expected
          workflow, = Path("target/host-wheels").glob("kat_workflow-*.whl")
          native, = Path("target/host-wheels").glob("kat_datasource-*.whl")
          cli = "target/debug/kat.exe" if os.name == "nt" else "target/debug/kat"
          subprocess.run([sys.executable, "build/verify_sdk_install.py",
              "--kat", cli, "--workflow-wheel", str(workflow),
              "--datasource-wheel", str(native), "--sdk-wheel", str(sdk),
              "--output", "target/sdk-verification"], check=True)
          PY
      - name: Upload verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-evidence-${{ matrix.os }}
          path: target/sdk-verification/report.json
          retention-days: 1
          if-no-files-found: error
