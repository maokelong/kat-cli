[workspace]
members = [
    "htrace-core",
    "htrace-model",
    "htrace-parser-harmony",
    "htrace-query",
    "htrace-engine-cli",
    "htrace-web-ui",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
axum = "0.8"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
datafusion = "53.1.0"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3.10"
thiserror = "2.0"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }
