[package]
name = "local-compare-cpp-sqlite"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "compare-cpp-sqlite"
path = "../bin/compare_cpp_sqlite.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
trace-model = { path = "../../../crates/kat-rs-datasource/crates/trace-model" }
trace-parser = { path = "../../../crates/kat-rs-datasource/crates/trace-parser" }
trace-query = { path = "../../../crates/kat-rs-datasource/crates/trace-query" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }
