[workspace]
members = [
    "crates/kat-rs-cli",
    "crates/kat-rs-daemon",
    "crates/kat-rs-datasource",
    "kat/platform/cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
arrow-array = "58.0.0"
arrow-json = "58.0.0"
arrow-schema = "58.0.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
datafusion = { version = "53.1.0", default-features = false, features = ["sql", "compression", "parquet"] }
dunce = "1.0"
directories = "6.0"
env_logger = "0.11"
flate2 = "1.0"
futures = "0.3"
log = "0.4"
memmap2 = "0.9"
miette = { version = "7.6", features = ["fancy"] }
parquet = { version = "58.0.0", features = ["arrow"] }
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3.2"
serde = { version = "1.0", features = ["derive"] }
serde_arrow = { version = "0.14.1", features = ["arrow-58"] }
serde_bytes = "0.11"
serde_json = "1.0"
tempfile = "3.10"
thiserror = "2.0"
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "sync", "net", "signal", "time"] }
utoipa = "5.5.0"
url = "2.5"
uuid = { version = "1.8", features = ["v7"] }
