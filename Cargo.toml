[workspace]
members = [
    "crates/kat-rs-cli",
    "crates/kat-rs-datasource",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
arrow-array = "58.0.0"
arrow-json = "58.0.0"
arrow-schema = "58.0.0"
clap = { version = "4.5", features = ["derive"] }
datafusion = { version = "53.1.0", default-features = false, features = ["sql", "compression"] }
env_logger = "0.11"
flate2 = "1.0"
log = "0.4"
memmap2 = "0.9"
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3.2"
serde = { version = "1.0", features = ["derive"] }
serde_arrow = { version = "0.14.1", features = ["arrow-58"] }
serde_bytes = "0.11"
serde_json = "1.0"
tempfile = "3.10"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }
