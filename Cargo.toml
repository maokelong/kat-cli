[workspace]
members = [
    "kat/platform/cli",
    "kat/platform/datasource",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.1-rc.3"
publish = false

[workspace.dependencies]
anyhow = "1.0"
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["json"] }
dunce = "1.0"
directories = "6.0"
heck = "0.5"
log = "0.4"
memmap2 = "0.9"
miette = { version = "7.6", features = ["fancy"] }
parquet = { version = "58.0.0", features = ["arrow"] }
prost = "0.14"
prost-build = "0.14"
prost-reflect = { version = "0.16.5", default-features = false }
prost-types = "0.14"
protoc-bin-vendored = "3.2"
pyo3 = "0.29.2"
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_arrow = { version = "0.14.1", features = ["arrow-58"] }
serde_json = "1.0"
strip-ansi = { package = "distill-strip-ansi", version = "0.6.1", default-features = false, features = ["std"] }
tempfile = "3.10"
thiserror = "2.0"
toml = "0.9"
uuid = { version = "1.8", features = ["v7"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
