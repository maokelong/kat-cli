id: cpu_contention_summary
domain: scheduler-kernel
engine: perfetto-sql
description: 汇总启动窗口内运行时间最高的进程，辅助判断 CPU 竞争。
inputs:
  start_ts:
    type: timestamp
    required: true
  end_ts:
    type: timestamp
    required: true
resources:
  timeout_ms: 30000
  max_rows: 50
  max_result_bytes: 65536
  priority: p2
sql: |
  SELECT
    COALESCE(p.name, mt.name, t.name, 'pid:' || p.pid) AS process_name,
    COUNT(*) AS slice_count,
    SUM(s.dur) / 1000000.0 AS running_ms
  FROM sched s
  JOIN thread t ON t.utid = s.utid
  JOIN process p ON p.upid = t.upid
  LEFT JOIN thread mt ON mt.upid = p.upid AND mt.is_main_thread = 1
  WHERE s.ts >= :start_ts
    AND s.ts < :end_ts
  GROUP BY process_name
  ORDER BY running_ms DESC
  LIMIT 50;
outputs:
  columns:
    - name: process_name
      type: string
    - name: slice_count
      type: int64
    - name: running_ms
      type: duration_ms
