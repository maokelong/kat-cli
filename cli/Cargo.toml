[package]
name = "htrace"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "htrace"
path = "src/lib.rs"

[[bin]]
name = "htrace"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
